name: Fork

# Our changes to upstream Strix live as code plus one patch per changed file
# (fork/patches). This fails a PR whose patches are out of step with its code,
# or that lost the upstream checkpoint commit (a squashed sync PR).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: fork/dev verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # the checkpoint commit must be in history
          persist-credentials: false
      - run: fork/dev verify
