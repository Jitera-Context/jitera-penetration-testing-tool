# Baseline for the OWASP Juice Shop eval.
#
# Juice Shop is a deliberately vulnerable training app published by OWASP for
# exactly this purpose. Each entry is a vulnerability CATEGORY we expect a good
# scan to surface, with the signals the scorer uses to map a finding onto it.
# This is public, category-level knowledge — not exploit payloads.
#
# A run passes when it covers at least `min_categories` of these. That is the
# "consistent, X issues" gate: robust to normal LLM run-to-run variance, while
# still catching a regression where the agent stops finding whole classes.

target: "https://demo.owasp-juice.shop"
min_categories: 6          # the gate: cover at least this many categories to pass
scan_mode: "standard"      # quick | standard | deep
max_budget_usd: 15

# Match rules per category: a finding maps to a category if its CWE is in `cwe`
# OR any string in `keywords` appears (case-insensitively) in its title,
# weakness, or description.
categories:
  - id: sqli
    title: "SQL Injection (incl. login bypass)"
    cwe: [89]
    keywords: ["sql injection", "sqli"]
  - id: xss
    title: "Cross-Site Scripting"
    cwe: [79]
    keywords: ["cross-site scripting", "xss"]
  - id: broken-access-control
    title: "Broken Access Control / IDOR"
    cwe: [284, 285, 639, 862, 863]
    keywords: ["access control", "idor", "insecure direct object", "authorization", "privilege escalation"]
  - id: broken-auth
    title: "Broken Authentication"
    cwe: [287, 307, 384, 640]
    keywords: ["authentication bypass", "broken authentication", "weak password", "brute force", "session fixation"]
  - id: sensitive-data-exposure
    title: "Sensitive Data Exposure"
    cwe: [200, 215, 538]
    keywords: ["sensitive data", "information disclosure", "data exposure", "exposed", "leak"]
  - id: security-misconfiguration
    title: "Security Misconfiguration"
    cwe: [16, 933, 756]
    keywords: ["misconfiguration", "security header", "cors", "default credential", "directory listing"]
  - id: vulnerable-components
    title: "Vulnerable / Outdated Components"
    cwe: [937, 1035, 1104]
    keywords: ["outdated", "vulnerable component", "known vulnerabilit", "dependency", "cve-"]
  - id: injection-other
    title: "Other Injection (NoSQL / command / SSTI)"
    cwe: [77, 78, 94, 943, 1336]
    keywords: ["nosql injection", "command injection", "template injection", "ssti", "code injection"]
  - id: xxe
    title: "XML External Entity (XXE)"
    cwe: [611]
    keywords: ["xxe", "xml external entity"]
  - id: ssrf
    title: "Server-Side Request Forgery"
    cwe: [918]
    keywords: ["ssrf", "server-side request forgery"]
  - id: unvalidated-redirect
    title: "Unvalidated Redirect / Open Redirect"
    cwe: [601]
    keywords: ["open redirect", "unvalidated redirect"]
  - id: crypto-issues
    title: "Cryptographic Issues"
    cwe: [310, 326, 327, 328, 916]
    keywords: ["weak hash", "weak crypto", "insecure cipher", "cryptograph"]
